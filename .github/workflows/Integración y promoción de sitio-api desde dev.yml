name: Integración y promoción de sitio-api desde dev

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  validacion:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Instalar dependencias
        run: python -m pip install --group dev --group prd

      - name: Validar formato
        run: ruff format --check .

      - name: Validar imports
        run: isort --check-only .

      - name: Ejecutar pruebas
        run: >
            python -m pytest
            -x
            --strict
            --cov=.
            --cov-branch
            --no-cov-on-fail
            --cov-report=term-missing
            --cov-fail-under=100

  promocion:
    needs:
      - validacion

    runs-on: ubuntu-latest

    steps:
      - name: Generar token de promoción
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Promover dev hacia main
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"base":"main","head":"dev","commit_message":"Promoción automática de dev hacia main"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/merges"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}