[project]
name = "sitio-api"
version = "0.2.1"
description = "API del sitio personal."
requires-python = ">=3.11"
authors = [
    {name = "Allan Almeida", email = "arumeidaaran@outlook.com"},
]
maintainers = [
    {name = "Allan Almeida", email = "arumeidaaran@outlook.com"},
]
readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-only"
license-files = ["LICENSE"]

[project.urls]
Homepage = "..."
Documentation = "https://github.com/arumeidaaran/sitio-api/blob/main/README.md"
Repository = "https://github.com/arumeidaaran/sitio-api"
Changelog = "https://github.com/arumeidaaran/sitio-api/blob/main/CHANGELOG.md"

[dependency-groups]
prd = [
    "Flask",
    "Flask-Cors",
    "gunicorn",
    "Markdown",
    "python-frontmatter",
    "pydantic",
    "flask-openapi[swagger]==5.0.0rc2",
]

dev = [
    "ruff",
    "isort",
    "pytest",
    "pytest-cov",
    "packaging",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 79
extend-exclude = [
    "venv314",
]

[tool.ruff.format]
quote-style = "single"

[tool.isort]
profile = "black"
line_length = 79
extend_skip = [
    "venv314",
]
skip_gitignore = true
